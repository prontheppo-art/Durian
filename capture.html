<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panoramic Minor Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
        html, body {
            touch-action: none;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
            position: fixed;
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-[100dvh] w-screen flex flex-col select-none overflow-hidden">

    <!-- Header (ตัวนับยอดผู้เข้าชมที่มุมขวาบน) -->
    <header class="bg-slate-800 border-b border-slate-700 py-2 px-4 flex justify-between items-center z-20 shadow-md shrink-0">
        <h1 class="text-sm sm:text-base font-bold">Panoramic Minor Garden</h1>
        
        <div class="flex items-center gap-1.5 bg-slate-900/80 border border-slate-700/80 px-2 py-0.5 rounded-full text-xs font-mono text-emerald-400 shadow-inner">
            <span class="text-xs">👁️</span>
            <span id="visitorCount">...</span>
        </div>
    </header>

    <!-- Main Map Area -->
    <main class="flex-1 relative w-full h-full overflow-hidden flex items-center justify-center bg-slate-950 p-1">
        <div class="relative w-full h-full bg-emerald-950/40 border border-emerald-600/50 rounded-xl flex items-center justify-center overflow-hidden">
            <div class="grid grid-cols-6 gap-1.5 sm:gap-2 relative scale-[0.95] sm:scale-100 origin-center" id="treeGrid"></div>
        </div>
    </main>

    <!-- Modal 1: ถ่ายรูป & เซฟลงเครื่อง -->
    <div id="photoModal" onclick="closeModalOnOutside(event, 'photoModal')" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-end justify-center z-40 hidden">
        <div class="bg-white text-slate-800 w-full max-w-lg rounded-t-3xl p-4 sm:p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-3">
                <h3 id="modalTitle" class="text-lg sm:text-xl font-black text-slate-800 tracking-wide">สวนทุเรียนของฉัน</h3>
                <button onclick="closeModal('photoModal')" class="text-slate-400 hover:text-slate-600 text-3xl font-bold px-2">&times;</button>
            </div>
            
            <div class="flex justify-between items-center mb-4 gap-2">
                <div class="text-xs text-slate-500 font-semibold flex-1">
                    * กดถ่ายรูป ระบบจะตั้งชื่อและบันทึกลงมือถือทันที
                </div>
                
                <!-- input สำหรับเปิดกล้องมือถือ -->
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageSaveLocally(event)">
                <button onclick="triggerCamera()" id="uploadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold flex items-center gap-1.5 shadow-md shrink-0 active:scale-95 transition">
                    <span>📷</span> ถ่ายและเซฟรูปนี้
                </button>
            </div>

            <div id="modalContent" class="flex-1 overflow-y-auto min-h-[200px] flex flex-col items-center justify-center text-slate-500 text-sm font-semibold">
                กดปุ่ม "ถ่ายและเซฟรูปนี้" ด้านบนเพื่อบันทึกภาพลงเครื่อง
            </div>
        </div>
    </div>

    <script>
        const rows = ['M', 'L', 'K', 'J', 'I', 'H', 'G', 'F', 'E', 'D', 'C', 'B', 'A'];
        const cols = [6, 5, 4, 3, 2, 1];
        let activeTreeIds = [];

        const verticalHipRoofOverlay = `
            <div onclick="openTreePhotos('D6', 'C6')" class="absolute inset-0 bg-slate-900/90 border border-orange-500 rounded-xl p-0.5 cursor-pointer hover:border-orange-400 transition shadow-lg flex items-center justify-center z-10">
                <svg class="w-full h-full" viewBox="0 0 40 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="2" width="36" height="96" rx="4" fill="#F97316" stroke="#9A3412" stroke-width="1.5"/>
                </svg>
            </div>
        `;

        const horizontalHouseOverlay = `
            <div onclick="openTreePhotos('L6', 'L5')" class="absolute inset-0 bg-amber-950/90 border border-amber-500 rounded-xl p-0.5 cursor-pointer hover:border-amber-400 transition shadow-lg flex items-center justify-center z-10">
                <svg class="w-full h-full" viewBox="0 0 100 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="14" width="42" height="22" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
                </svg>
            </div>
        `;

        async function loadVisitorCount() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/panoramic-minor-garden-th/visits/up');
                const data = await response.json();
                document.getElementById('visitorCount').innerText = `${(data && data.count) ? data.count.toLocaleString() : 1} ครั้ง`;
            } catch (err) {
                document.getElementById('visitorCount').innerText = '-';
            }
        }

        function generateMap() {
            const gridContainer = document.getElementById('treeGrid');
            gridContainer.innerHTML = '';

            rows.forEach(row => {
                cols.forEach(col => {
                    const treeId = `${row}${col}`;
                    const cellWrapper = document.createElement('div');
                    cellWrapper.className = 'relative w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center';
                    cellWrapper.id = `cell-${treeId}`;

                    const btn = document.createElement('button');
                    btn.className = 'w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-950/90 hover:bg-emerald-600 border border-amber-700/60 flex items-center justify-center text-white font-black text-[10px] sm:text-xs shadow-md active:scale-95';
                    btn.innerText = treeId;
                    btn.onclick = () => openTreePhotos(treeId);

                    if (treeId === 'M1') {
                        btn.className = 'w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-amber-600 hover:bg-amber-500 border border-amber-400 flex items-center justify-center text-xs sm:text-sm shadow-lg active:scale-95';
                        btn.innerHTML = '🏠';
                        btn.onclick = () => { window.location.href = 'capture.html'; };
                    }

                    cellWrapper.appendChild(btn);
                    gridContainer.appendChild(cellWrapper);
                });
            });

            const cellL6 = document.getElementById('cell-L6');
            if (cellL6) {
                const houseContainer = document.createElement('div');
                houseContainer.className = 'absolute top-0 left-0 w-[68px] h-8 sm:w-[76px] sm:h-9 pointer-events-auto';
                houseContainer.innerHTML = horizontalHouseOverlay;
                cellL6.appendChild(houseContainer);
            }

            const cellD6 = document.getElementById('cell-D6');
            if (cellD6) {
                const roofContainer = document.createElement('div');
                roofContainer.className = 'absolute top-0 left-0 w-8 h-[68px] sm:w-9 sm:h-[76px] pointer-events-auto';
                roofContainer.innerHTML = verticalHipRoofOverlay;
                cellD6.appendChild(roofContainer);
            }
        }

        function openTreePhotos(...treeIds) {
            activeTreeIds = treeIds;
            const modal = document.getElementById('photoModal');
            const title = document.getElementById('modalTitle');
            const titleText = treeIds.join('-');
            title.innerText = `บันทึกรูปตำแหน่ง: ${titleText}`;
            modal.classList.remove('hidden');
        }

        function triggerCamera() {
            const cameraInput = document.getElementById('cameraInput');
            cameraInput.value = '';
            cameraInput.click();
        }

        // ฟังก์ชันจัดการถ่ายรูปและเซฟลงเครื่องมือถือทันทีตามชื่อที่กำหนด
        async function handleImageSaveLocally(event) {
            const file = event.target.files[0];
            if (!file) return;

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const treePrefix = activeTreeIds.length > 0 ? activeTreeIds[0] : 'Tree';
            
            // ตั้งชื่อไฟล์ตามตำแหน่งและวันที่ เช่น B1-2026-09-28.jpg
            const fileName = `${treePrefix}-${yyyy}-${mm}-${dd}.jpg`;

            try {
                // สร้างลิงก์จำลองสำหรับดาวน์โหลดไฟล์ลงเครื่องอัตโนมัติ
                const blobUrl = URL.createObjectURL(file);
                const downloadLink = document.createElement('a');
                downloadLink.href = blobUrl;
                downloadLink.download = fileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

                const content = document.getElementById('modalContent');
                content.innerHTML = `
                    <div class="text-center py-6 text-emerald-600">
                        <span class="text-4xl">✅</span>
                        <p class="mt-2 text-base font-bold text-slate-800">บันทึกรูปภาพสำเร็จ!</p>
                        <p class="text-xs font-mono bg-slate-100 p-2 rounded mt-2 text-slate-700">${fileName}</p>
                        <p class="text-xs text-slate-500 mt-1">รูปถูกดาวน์โหลดลงเครื่องมือถือของคุณแล้ว</p>
                    </div>
                `;
            } catch (err) {
                console.error('[Save Error]:', err);
                alert('ไม่สามารถบันทึกรูปภาพได้');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function closeModalOnOutside(event, modalId) {
            if (event.target.id === modalId) {
                closeModal(modalId);
            }
        }

        function initData() {
            generateMap();
            loadVisitorCount();
        }

        document.addEventListener('DOMContentLoaded', initData);
    </script>
</body>
</html>
