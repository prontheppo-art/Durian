<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panoramic Minor Garden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white h-[100dvh] w-screen flex flex-col select-none overflow-hidden">

    <!-- Header (ตัวนับยอดผู้เข้าชมที่มุมขวาบน) -->
    <header class="bg-slate-800 border-b border-slate-700 py-2.5 px-4 flex justify-between items-center z-20 shadow-md shrink-0">
        <h1 class="text-base sm:text-lg font-bold">Panoramic Minor Garden</h1>
        
        <div class="flex items-center gap-1.5 bg-slate-900/80 border border-slate-700/80 px-2.5 py-1 rounded-full text-xs font-mono text-emerald-400 shadow-inner">
            <span class="text-sm">👁️</span>
            <span id="visitorCount">...</span>
        </div>
    </header>

    <!-- Main Map Area -->
    <main class="flex-1 relative w-full h-full overflow-hidden flex items-center justify-center bg-slate-950 p-1">
        <div class="relative w-full h-full bg-emerald-950/40 border border-emerald-600/50 rounded-xl flex items-center justify-center overflow-hidden">
            <div class="grid grid-cols-6 gap-2.5 sm:gap-3 relative scale-[1.9] sm:scale-[2.3] origin-center" id="treeGrid"></div>
        </div>
    </main>

    <!-- Modal 1: เลือกรูปภาพ & ถ่ายรูป -->
    <div id="photoModal" onclick="closeModalOnOutside(event, 'photoModal')" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-end justify-center z-40 hidden">
        <div class="bg-white text-slate-800 w-full max-w-lg rounded-t-3xl p-5 sm:p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-3">
                <h3 id="modalTitle" class="text-xl sm:text-2xl font-black text-slate-800 tracking-wide">สวนทุเรียนของฉัน</h3>
                <button onclick="closeModal('photoModal')" class="text-slate-400 hover:text-slate-600 text-3xl font-bold px-2">&times;</button>
            </div>
            
            <div class="flex justify-between items-center mb-4 gap-2">
                <div id="yearTabs" class="flex gap-2 overflow-x-auto pb-1 flex-1 text-sm sm:text-base font-bold"></div>
                
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="handleImageUpload(event)">
                <button onclick="triggerCamera()" id="uploadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 sm:py-2.5 rounded-xl text-sm sm:text-base font-extrabold flex items-center gap-1.5 shadow-md shrink-0 active:scale-95 transition">
                    <span class="text-lg">📷</span> ถ่ายรูปต้นนี้
                </button>
            </div>

            <div id="modalContent" class="flex-1 overflow-y-auto min-h-[220px] flex flex-col items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal 2: Lightbox สไลด์รูปขนาดใหญ่ -->
    <div id="lightboxModal" onclick="closeModalOnOutside(event, 'lightboxModal')" class="fixed inset-0 bg-black z-50 hidden flex flex-col justify-between">
        <div class="w-full flex justify-between items-center text-white z-20 p-4 bg-gradient-to-b from-black/80 to-transparent shrink-0">
            <span id="lightboxTitle" class="text-base sm:text-lg font-mono font-bold"></span>
            <button onclick="closeModal('lightboxModal')" class="text-3xl text-white hover:text-gray-300 p-2">&times;</button>
        </div>

        <div class="relative w-full flex-1 flex items-center justify-center overflow-hidden p-2" id="swipeArea">
            <button onclick="prevImage()" class="absolute left-3 bg-black/60 text-white p-3 rounded-full hover:bg-black/90 z-20 text-xl shadow-lg">❮</button>
            
            <div class="w-full h-full flex items-center justify-center overflow-hidden">
                <img id="lightboxImg" src="" class="max-w-full max-h-full object-contain transition-transform duration-75 origin-center select-none" style="touch-action: none; will-change: transform;">
            </div>
            
            <button onclick="nextImage()" class="absolute right-3 bg-black/60 text-white p-3 rounded-full hover:bg-black/90 z-20 text-xl shadow-lg">❯</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
