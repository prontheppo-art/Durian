<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บรรทัดนี้สำคัญมาก ช่วยป้องกันหน้าจอล้นและปรับขนาดให้พอดีกับหน้าจอมือถือ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panoramic Minor Garden</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b192c;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            padding: 15px;
            background-color: #1e3e62;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            font-size: 18px;
            font-weight: bold;
        }
        .view-badge {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }
        .plot-node {
            aspect-ratio: 1;
            background-color: #5c2c16;
            border: 2px solid #8b4513;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <span>Panoramic Minor Garden</span>
        <div class="view-badge">👁️ 1 ครั้ง</div>
    </div>

    <div class="grid-container">
        <!-- แถว I -->
        <div class="plot-node">I5</div>
        <div class="plot-node">I4</div>
        <div class="plot-node">I3</div>
        <div class="plot-node">I2</div>

        <!-- แถว H -->
        <div class="plot-node">H5</div>
        <div class="plot-node">H4</div>
        <div class="plot-node">H3</div>
        <div class="plot-node">H2</div>

        <!-- แถว G -->
        <div class="plot-node">G5</div>
        <div class="plot-node">G4</div>
        <div class="plot-node">G3</div>
        <div class="plot-node">G2</div>

        <!-- แถว F -->
        <div class="plot-node">F5</div>
        <div class="plot-node">F4</div>
        <div class="plot-node">F3</div>
        <div class="plot-node">F2</div>

        <!-- แถว E -->
        <div class="plot-node">E5</div>
        <div class="plot-node">E4</div>
        <div class="plot-node">E3</div>
        <div class="plot-node">E2</div>

        <!-- แถว D -->
        <div class="plot-node">D5</div>
        <div class="plot-node">D4</div>
        <div class="plot-node">D3</div>
        <div class="plot-node">D2</div>
    </div>

</body>
</html>
